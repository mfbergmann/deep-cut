# Deep Cut. Generic on purpose: everything specific to one server (paths,
# networks, labels, the Disc Two mount) goes in docker-compose.override.yml,
# which compose loads automatically and which is not committed.
services:
  deep-cut:
    build: .
    image: deep-cut:local
    container_name: deep-cut
    user: "${PUID:-99}:${PGID:-100}"
    environment:
      - TZ=${TZ:-UTC}
      - RADARR_URL=${RADARR_URL:-http://radarr:7878}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - VIMEO_TOKEN=${VIMEO_TOKEN:-}
      - MIN_AGE_DAYS=${MIN_AGE_DAYS:-14}
      - RESCAN_DAYS=${RESCAN_DAYS:-7}
      - SCAN_HOUR=${SCAN_HOUR:-3}
      - MIN_SCORE=${MIN_SCORE:-45}
      - INBOX_SHARE=${INBOX_SHARE:-}
    volumes:
      - ${CONFIG_DIR:-./config}:/config
      # Mounted exactly as Radarr mounts it, so staging paths are valid for
      # Radarr's manual import verbatim.
      - ${MEDIA_DIR}:/data
    ports:
      - "${WEB_PORT:-8473}:8473"
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
